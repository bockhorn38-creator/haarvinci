name: Geprüfte APK als direkte Datei bereitstellen
on:
  push:
    tags: ['publish-android-apk-file-v0.6.0*']
permissions:
  actions: read
  contents: write
concurrency:
  group: android-download-0.6.0
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 01381dbedb92dc73664b0fefe9f56c1b34a7f61d
      SOURCE_RUN: '42832780923'
    steps:
      - name: Erfolgreich geprüften Build bestätigen
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('source-run.json').read_text())
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['path'] == '.github/workflows/android.yml'
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '42832780923'
          name: Haarvinci-Android-Test-APK
          path: apk
      - name: Originale APK prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('apk')
          apk = root / 'Haarvinci-Android-Test-0.6.0.apk'
          entries = (root / 'SHA256SUMS.txt').read_text().splitlines()
          assert len(entries) == 1
          expected, filename = entries[0].split(maxsplit=1)
          assert Path(filename.strip().lstrip('*')).name == apk.name
          assert hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest() == expected
          (root / 'SHA256SUMS.txt').write_text(f'{expected}  {apk.name}\n')
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs apk/Haarvinci-Android-Test-0.6.0.apk > checked-signature.txt
          cmp apk/SIGNATUR.txt checked-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apk/Haarvinci-Android-Test-0.6.0.apk > apk-info.txt
          grep -q "package: name='de.haarvinci.app.preview' versionCode='5' versionName='0.6.0'" apk-info.txt
      - uses: actions/checkout@v4
        with:
          path: distribution
          ref: android-test-downloads
      - name: Neue APK ergänzen und bisherige Versionen erhalten
        run: |
          set -euo pipefail
          exec > >(tee distribution.log) 2>&1
          cd distribution
          # Nur neue Versionsdateien ergänzen; vorhandene APKs/Prüfsummen erhalten.
          test ! -e Haarvinci-Android-Test-0.6.0.apk
          test ! -e 0.6.0
          mkdir 0.6.0
          cp ../apk/Haarvinci-Android-Test-0.6.0.apk .
          cp ../apk/SHA256SUMS.txt ../apk/SIGNATUR.txt 0.6.0/
          cat > 0.6.0/README.md <<'NOTES'
          # Haarvinci Android-Testversion 0.6.0

          Die einzelne APK in diesem Zweig wurde unverändert aus dem erfolgreichen Android-Emulatortest 42832780923 übernommen. SHA256SUMS.txt und SIGNATUR.txt dokumentieren die geprüfte Originaldatei.

          Neu: Verknüpfte Behandlungen und Dokumentation, konfigurierbare Weaving-Gesamtpreise je Reihenanzahl, Zusatzleistungen, individuelle Gesamtpreise, Anzahlungen, Teil-/Restzahlungen, Korrekturstornos und Rückerstattungen sowie Kunden- und Finanzstatistiken. ChatGPT-Import v2 ergänzt zusammengehörige Behandlungen und Geldbuchungen; v1 bleibt unterstützt. Speicherung erst nach ausdrücklicher Bestätigung. Bestehende Kunden-, Haarprofil-, Extensions-, Kalender-, CalendarContract-, Anmelde- und Sicherungsfunktionen bleiben erhalten. Kein zusätzlicher Server, keine OpenAI-API und keine Lagerverwaltung. Die Preisliste startet leer; nur eigene Tarife eintragen. Zahlungen werden dokumentiert, nicht extern ausgeführt.

          Dokumentation im Hauptzweig: docs/BEHANDLUNGEN-ZAHLUNGEN.md, docs/CHATGPT-IMPORT.md und docs/PRUEFUNG.md. Sieben native Prüfungen einschließlich Kunden-/Kalender-/Sicherungsablauf, Calendar Provider, Android-Textimport sowie Behandlungen/Zahlungen/Import v2 und Prozessneustart sind im Pixel-6-Emulator unter Android 15 geprüft. Echte Google-Kontosynchronisierung und die genaue Text-/Link-Übergabe der installierten ChatGPT-App müssen noch auf dem Pixel getestet werden.

          Testsignierung: die vorherige Testversion bei abweichender Signatur deinstallieren und diese APK frisch installieren. Bisherige lokale Testdaten gehen dabei verloren. Ausschließlich fiktive Daten verwenden. Keine automatische Gerätesynchronisierung.

          Der separate Download-Zweig dient als Ersatz, weil die GitHub-Actions-Integration das Anlegen eines GitHub Releases mit HTTP 403 verweigert. Der Hauptzweig enthält ausschließlich Quellcode; die Repository-Sichtbarkeit wird nicht geändert.
          NOTES
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Haarvinci-Android-Test-0.6.0.apk 0.6.0/
          git commit -m 'Distribute verified Android test APK 0.6.0 without rebuilding'
          git push origin HEAD:refs/heads/android-test-downloads
          git rev-parse HEAD
      - name: Direkten Download ohne Anmeldung prüfen
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output downloaded.apk "https://github.com/$GH_REPO/raw/refs/heads/android-test-downloads/Haarvinci-Android-Test-0.6.0.apk"
          cmp apk/Haarvinci-Android-Test-0.6.0.apk downloaded.apk
      - name: Fehler als Check-Hinweis ausgeben
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('distribution.log')
          if path.exists():
              text = path.read_text(errors='replace')[-10000:]
              print('::error title=APK-Dateiveröffentlichung::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
