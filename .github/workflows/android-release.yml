name: Vorhandene Android-Test-APK veröffentlichen

on:
  push:
    tags: ['publish-android-test-v0.4.0*']
  workflow_dispatch:
    inputs:
      source_run:
        description: Erfolgreicher Android-Prüflauf mit der fertigen APK
        required: true
        type: string
      source_sha:
        description: Vollständiger Quellcommit des geprüften Builds
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: android-test-release-0.4.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run || '40562980839' }}
      SOURCE_SHA: ${{ inputs.source_sha || '711b6c9e6d570efef7097ae90778444163928076' }}
      RELEASE_TAG: android-test-v0.4.0
    steps:
      # Der Veröffentlichungstag wird erst nach erfolgreichem Testlauf gepusht.
      # Die Vorgaben verweisen auf exakt den geprüften 0.4.0-Quellstand.
      # Bewusst kein Checkout, Gradle oder neuer Build: die bereits geprüften
      # APK-Bytes einschließlich der ursprünglichen Signatur weiterverwenden.
      - name: Erfolgreichen ursprünglichen Testlauf bestätigen
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('source-run.json').read_text())
          assert run['status'] == 'completed'
          assert run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['path'] == '.github/workflows/android.yml'
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN }}
          name: Haarvinci-Android-Test-APK
          merge-multiple: true
          path: apk
      - name: Ursprüngliche Prüfsumme, APK und Signatur prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('apk')
          apk = root / 'Haarvinci-Android-Test-0.4.0.apk'
          entries = (root / 'SHA256SUMS.txt').read_text().splitlines()
          assert len(entries) == 1, 'Genau eine APK-Prüfsumme erwartet'
          expected, name = entries[0].split(maxsplit=1)
          assert Path(name.strip().lstrip('*')).name == apk.name
          assert hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest() == expected
          # Im Release enthält die Prüfsummendatei den direkten Assetnamen.
          (root / 'SHA256SUMS.txt').write_text(f'{expected}  {apk.name}\n')
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs apk/Haarvinci-Android-Test-0.4.0.apk > verified-signature.txt
          cmp apk/SIGNATUR.txt verified-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apk/Haarvinci-Android-Test-0.4.0.apk > apk-info.txt
          grep -q "package: name='de.haarvinci.app.preview' versionCode='2' versionName='0.4.0'" apk-info.txt
      - name: Einzelne APK als GitHub-Testrelease bereitstellen
        run: |
          set -euo pipefail
          exec > >(tee release.log) 2>&1
          cat > release-notes.md <<'NOTES'
          ## Haarvinci Android-Testversion 0.4.0

          Die APK unten unter **Assets** direkt auf dem Google Pixel herunterladen und öffnen. Kein Entpacken und keine Verbindung zur Windows-App erforderlich. Android ab Version 8, ARM64 (Pixel) und x86-64.

          Diese APK stammt unverändert aus dem erfolgreich geprüften Android-Testlauf. Sie wurde für die Übertragung in dieses Release **nicht erneut gebaut oder signiert**. Geprüft wurden Installation, Kundenverwaltung, Sicherung, Wiederherstellung und Datenerhaltung nach einem App-Neustart auf einem emulierten Pixel mit Android 15.

          Neu: strukturierte optionale Haarprofile, mehrere kundenbezogene Extensions-Positionen, freie Hersteller/Farben/Farbcodes, exakte Gesamtpreise, Lieferstatus, Suche und chronologische Änderungs- und Löschhistorie. Das bisherige Haarvinci-Design bleibt erhalten. Keine Lagerverwaltung, Zahlungs- oder Behandlungsverwaltung.

          **Installation über 0.3.0:** VersionCode ist erhöht, die Testsignatur dieses neuen Builds kann aber abweichen. Falls Android das Update ablehnt, die alte Test-App deinstallieren und 0.4.0 frisch installieren. Dabei gehen ihre lokalen Testdaten verloren; dies ist für diese Entwicklungsphase ausdrücklich vorgesehen.

          Beim ersten Start einen eigenen Zugang einrichten. Zunächst ausschließlich fiktive Kundendaten verwenden. Entwicklungs-/Testsignierung: vor späteren Testupdates oder einer Deinstallation eigene Daten außerhalb der App sichern. Keine automatische Synchronisierung zwischen Geräten.

          `SHA256SUMS.txt` und `SIGNATUR.txt` dokumentieren Prüfsumme und APK-Zertifikat.
          NOTES
          printf '\nGeprüfter Build: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$SOURCE_RUN" >> release-notes.md
          if gh release view "$RELEASE_TAG" --json targetCommitish,isDraft > existing.json 2>/dev/null; then
            python - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('existing.json').read_text())
          assert release['targetCommitish'] == os.environ['SOURCE_SHA'], 'Ein anderes Release-Ziel darf nicht überschrieben werden'
          assert release['isDraft'], 'Ein veröffentlichtes Release wird nicht verändert'
          PYVERIFY
            gh release upload "$RELEASE_TAG" --clobber apk/Haarvinci-Android-Test-0.4.0.apk apk/SHA256SUMS.txt apk/SIGNATUR.txt
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag --target "$SOURCE_SHA" \
              --title 'Haarvinci Android-Testversion 0.4.0' \
              --notes-file release-notes.md \
              --draft --prerelease \
              apk/Haarvinci-Android-Test-0.4.0.apk apk/SHA256SUMS.txt apk/SIGNATUR.txt
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json url,assets
          curl --fail --location --retry 3 --output downloaded.apk "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/Haarvinci-Android-Test-0.4.0.apk"
          cmp apk/Haarvinci-Android-Test-0.4.0.apk downloaded.apk
      - name: Release-Fehler als Check-Hinweis ausgeben
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('release.log')
          if path.exists():
              text = path.read_text(errors='replace')[-12000:]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Release-Veröffentlichung::{text}')
          PY
