plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'de.haarvinci.app'
    compileSdk 36
    defaultConfig {
        applicationId 'de.haarvinci.app.preview'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.5.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable true; minifyEnabled false }
    }
    packaging {
        resources { excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1'] }
    }
}
chaquopy {
    defaultConfig {
        version '3.12'
        buildPython('python3.12')
        // Django-Migrationssuche und Übersetzungskataloge benötigen echte Paketpfade.
        extractPackages('*')
        pip {
            install('-r', file('../requirements.lock').absolutePath)
            options('--require-hashes')
        }
    }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
