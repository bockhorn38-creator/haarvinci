<div class="form-field {% if field.errors %}has-error{% endif %}">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}
        {% if not field.field.required %}<span class="optional">optional</span>{% endif %}
    </label>
    {{ field }}
    <div id="{{ field.name }}-help" class="field-help">
        {% if field.help_text %}{{ field.help_text }}{% endif %}
    </div>
    <div id="{{ field.name }}-errors" class="field-error">
        {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
    </div>
</div>
